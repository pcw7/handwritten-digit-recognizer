<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>손글씨 숫자 인식</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --google-blue: #4285F4;
    --google-red: #EA4335;
    --google-yellow: #FBBC05;
    --google-green: #34A853;
    --text-primary: #202124;
    --text-secondary: #5f6368;
    --border-color: #dadce0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Roboto", "Segoe UI", sans-serif;
    background: #fff;
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 64px;
    margin: 0;
  }
  h1 {
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.5px;
    margin: 0;
  }
  h1 span:nth-child(1) { color: var(--google-blue); }
  h1 span:nth-child(2) { color: var(--google-red); }
  h1 span:nth-child(3) { color: var(--google-yellow); }
  h1 span:nth-child(4) { color: var(--google-blue); }
  h1 span:nth-child(5) { color: var(--google-green); }
  h1 span:nth-child(6) { color: var(--google-red); }
  p.subtitle {
    color: var(--text-secondary);
    font-size: 16px;
    margin: 12px 0 32px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 24px;
    box-shadow: 0 1px 6px rgba(32, 33, 36, 0.12);
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: #000;
    border-radius: 12px;
    cursor: crosshair;
    touch-action: none;
  }
  #result {
    font-size: 22px;
    font-weight: 500;
    margin: 24px 0 8px;
    min-height: 30px;
    color: var(--text-primary);
  }
  #result .confidence {
    color: var(--text-secondary);
    font-weight: 400;
    font-size: 16px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--google-blue);
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 10px 24px;
    margin-top: 8px;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }
  button:hover {
    background: #f8f9fa;
    box-shadow: 0 1px 3px rgba(32, 33, 36, 0.2);
  }
  footer {
    margin: 32px 0;
    color: var(--text-secondary);
    font-size: 13px;
  }
</style>
</head>
<body>
  <h1><span>손</span><span>글</span><span>씨</span><span> 숫</span><span>자</span><span> 인식</span></h1>
  <p class="subtitle">마우스나 손가락으로 0~9 사이의 숫자를 그려보세요</p>

  <div class="card">
    <canvas id="canvas" width="280" height="280"></canvas>
    <div id="result">숫자를 그려주세요</div>
    <button id="clearBtn">지우기</button>
  </div>

  <footer>손으로 그린 숫자를 놓는 즉시 자동으로 인식합니다</footer>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const resultEl = document.getElementById("result");

ctx.fillStyle = "#000";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.strokeStyle = "#fff";
ctx.lineWidth = 16;
ctx.lineCap = "round";
ctx.lineJoin = "round";

let drawing = false;
let lastX = 0;
let lastY = 0;
let hasInk = false;

function getPos(evt) {
  const rect = canvas.getBoundingClientRect();
  const point = evt.touches ? evt.touches[0] : evt;
  return {
    x: (point.clientX - rect.left) * (canvas.width / rect.width),
    y: (point.clientY - rect.top) * (canvas.height / rect.height),
  };
}

function startDraw(evt) {
  evt.preventDefault();
  drawing = true;
  const pos = getPos(evt);
  lastX = pos.x;
  lastY = pos.y;
}

function moveDraw(evt) {
  if (!drawing) return;
  evt.preventDefault();
  const pos = getPos(evt);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
  lastX = pos.x;
  lastY = pos.y;
  hasInk = true;
}

function endDraw(evt) {
  if (!drawing) return;
  evt.preventDefault();
  drawing = false;
  if (hasInk) {
    predict();
  }
}

canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mousemove", moveDraw);
canvas.addEventListener("mouseup", endDraw);
canvas.addEventListener("mouseleave", endDraw);

canvas.addEventListener("touchstart", startDraw);
canvas.addEventListener("touchmove", moveDraw);
canvas.addEventListener("touchend", endDraw);

document.getElementById("clearBtn").addEventListener("click", () => {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  hasInk = false;
  resultEl.textContent = "숫자를 그려주세요";
});

async function predict() {
  const dataUrl = canvas.toDataURL("image/png");
  resultEl.textContent = "인식 중...";
  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: dataUrl }),
    });
    const data = await res.json();
    if (data.error) {
      resultEl.textContent = "숫자를 먼저 그려주세요";
      return;
    }
    resultEl.innerHTML = `예측 결과: <b>${data.digit}</b> <span class="confidence">(신뢰도 ${data.confidence.toFixed(1)}%)</span>`;
  } catch (err) {
    resultEl.textContent = "인식에 실패했습니다";
  }
}
</script>
</body>
</html>
